services:
  - type: web
    name: painel-burn-rj
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --worker-class=gthread --threads=4 --timeout 0 --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: ION_TENANT
        sync: false        # preencher no dashboard Render
      - key: ION_OWNER
        value: BURN
      - key: ION_CI
        sync: false
      - key: ION_CS
        sync: false
      - key: ION_SAAK
        sync: false
      - key: ION_SASK
        sync: false
