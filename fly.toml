app = "painel-burn-rj"
primary_region = "gru"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "painel_data"
  destination = "/var/data"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
